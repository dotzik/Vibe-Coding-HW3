# pyproject.toml — definice projektu Hub Curator (HW3)
# src layout, console-script `curate` mapuje na hub_curator.__main__:main
[project]
name = "hub-curator"
version = "0.1.0"
description = "CLI kurátor markdown auto-memory knowledge base postavený na Claude Agent SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.53",
    "anyio>=4.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
curate = "hub_curator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hub_curator"]
